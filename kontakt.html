<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header-pocetna">
      <h1 class="naslov-pocetna">Kontakt</h1>
      <p class="podnaslov-pocetna">Kontaktirajte nas za više informacija</p>

      <div class="dugmici-pocetna">
        <a href="index.html" class="link-pocetna dugme-pocetna">Početna</a>

        <a href="onama.html" class="link-pocetna dugme-pocetna">O nama</a>
      </div>
    </header>

    <section class="kontakt-sekcija">
      <form class="forma-kontakt">
        <h2 class="naslov_frontend-pocetna">Pošaljite poruku</h2>

        <input type="text" placeholder="Unesite ime" class="input-kontakt" />

        <input type="email" placeholder="Unesite email" class="input-kontakt" />

        <textarea
          placeholder="Unesite poruku"
          class="textarea-kontakt"
        ></textarea>

        <button type="submit" class="dugme-forma">Pošalji</button>
      </form>

      <div class="kontakt-info">
        <h2 class="naslov_frontend-pocetna">Kontakt informacije</h2>

        <p class="tekst_onama">📍 Beograd, Srbija</p>
        <p class="tekst_onama">📞 +381 60 123 4567</p>
        <p class="tekst_onama">✉️ graficka@gmail.com</p>
      </div>
    </section>
  </body>
</html>
