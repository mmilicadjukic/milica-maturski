<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Контакт</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="header-pocetna">
      <h1 class="naslov-pocetna">Контакт</h1>
      <p class="podnaslov-pocetna">Контактирајте нас за више информација</p>

      <div class="dugmici-pocetna">
        <a href="index.html" class="link-pocetna dugme-pocetna">Почетна</a>

        <a href="onama.html" class="link-pocetna dugme-pocetna">О нама</a>
      </div>
    </header>

    <section class="kontakt-sekcija plavi_red">
      <form class="forma-kontakt">
        <h2 class="naslov_frontend-pocetna">Пошаљите поруку</h2>

        <input type="text" placeholder="Унесите име" class="input-kontakt" />

        <input type="email" placeholder="Унесите имејл" class="input-kontakt" />

        <textarea
          placeholder="Унесите поруку"
          class="textarea-kontakt"
        ></textarea>

        <button type="submit" class="dugme-forma">Пошаљи</button>
      </form>
    </section>

    <section class="kontakt-sekcija kontakt-info-sekcija">
      <div class="kontakt-info">
        <h2 class="naslov_frontend-pocetna">Контакт информације</h2>

        <p class="tekst_onama">📍 Београд, Србија</p>
        <p class="tekst_onama">📞 +381 60 123 4567</p>
        <p class="tekst_onama">✉️ graficka@gmail.com</p>
      </div>
    </section>
  </body>
